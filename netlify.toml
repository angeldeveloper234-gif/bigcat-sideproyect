[build]
  command = "npm run build"
  publish = "dist"

# ═══════════════════════════════════════════════════════════════════════════
#  EL ORDEN DE ESTAS REGLAS IMPORTA
#  Netlify aplica la PRIMERA que coincide. El comodin de SPA va siempre
#  ultimo: si sube, se come todo lo de abajo.
# ═══════════════════════════════════════════════════════════════════════════

# ── /inicio: un home duplicado ──────────────────────────────────────────────
# Devolvia 200 con el contenido del home. Dos URLs distintas sirviendo la misma
# pagina compiten entre si por las mismas busquedas de marca ("big cat",
# "bigcat"), que son de donde viene casi todo el trafico que hoy convierte.
# `force = true` porque el comodin de abajo tambien coincide con esta ruta.
[[redirects]]
  from = "/inicio"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/inicio/*"
  to = "/"
  status = 301
  force = true

# ── www -> dominio principal ────────────────────────────────────────────────
# http://www.bigcat.mx/ junta 662 apariciones propias con 4 clics: son senales
# que hoy se reparten entre dos hosts en vez de acumularse en uno. El canonical
# de cada pagina ya apunta a https://bigcat.mx, pero un canonical es una
# sugerencia; un 301 no lo es.
[[redirects]]
  from = "https://www.bigcat.mx/*"
  to = "https://bigcat.mx/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.bigcat.mx/*"
  to = "https://bigcat.mx/:splat"
  status = 301
  force = true

# ── http -> https en el dominio principal ───────────────────────────────────
# Netlify ya lo hace solo cuando el certificado esta activo. Se declara igual
# para que la regla exista en el repo y no dependa de una casilla del panel.
[[redirects]]
  from = "http://bigcat.mx/*"
  to = "https://bigcat.mx/:splat"
  status = 301
  force = true

# ── Lo que no existe, devuelve 404 ──────────────────────────────────────────
#
# ANTES: /* -> /index.html con status 200.
#
# Eso hacia que CUALQUIER URL inexistente devolviera el home con un 200.
# Verificado en produccion el 13/09:
#
#   curl -o /dev/null -w "%{http_code}" https://bigcat.mx/esto-no-existe-12345
#   200   <- y con el <title> del home
#
# No era solo /inicio: era todo el espacio de URLs del dominio. Para Google eso
# es un soft 404, y cada enlace roto, cada URL vieja y cada direccion mal
# tipeada se convertia en una copia mas del home compitiendo con el home.
#
# El cambio es seguro porque las 52 paginas estan prerenderizadas como archivo
# (verificado: las 52 responden 200 desde disco) y esta regla no lleva `force`,
# asi que no pisa ningun archivo existente. Solo atrapa lo que no existe.
#
# dist/404.html lo genera react-snap y ya trae <meta name="robots"
# content="noindex, follow">.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
